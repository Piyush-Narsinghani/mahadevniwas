name: Fetch BTS clips
on:
  push:
    branches: [bts-media]
    paths: [bts/ids.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and transcode
        run: |
          mkdir -p bts/clips
          while read name id; do
            [ -z "$name" ] && continue
            curl -sSL -o "/tmp/$name" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            ls -l "/tmp/$name"
            ffmpeg -nostdin -y -loglevel error -i "/tmp/$name" -vf "scale='if(gt(iw,ih),-2,1080)':'if(gt(iw,ih),1080,-2)'" -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -c:a aac -b:a 128k "bts/clips/${name%.*}.mp4"
          done < bts/ids.txt
          ls -l bts/clips
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bts/clips && git commit -m "Add BTS clips" && git push
